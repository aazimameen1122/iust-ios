# xcodegen project spec — generates IUST.xcodeproj on CI (no Mac needed locally)
name: IUST
options:
  bundleIdPrefix: com.mussey
  deploymentTarget:
    iOS: "17.0"
targets:
  IUST:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - IUSTWidget
          - .github
          - README.md
          - AppIcon-1024.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mussey.iustapp
        PRODUCT_NAME: IUST
        MARKETING_VERSION: "2.22"
        CURRENT_PROJECT_VERSION: "32"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
    info:
      properties:
        CFBundleDisplayName: IUST
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Unlock your saved IUST portal login.
